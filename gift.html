<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="gift.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<body>


<div class="hearts"></div>


<h1>
A Special Gift For You ❤️

<div class="gift-body">

<div class="ribbon"></div>

</div>


</div>


</div>



<div class="sparkles"></div>



<div class="message" id="message">


<div class="card">


<h2>
For My Beautiful Sidra ❤️
</h2>


<p>

You are not just a part of my life...
You are the reason my life feels more beautiful.

Every smile of yours is my favorite memory.

❤️

</p>



<button id="nextBtn">

Open Final Surprise ✨

</button>


</div>


</div>




<script src="gift.js"></script>
